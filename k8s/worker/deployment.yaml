apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: localhost:31500/today-me-backend:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "app.core.celery.celery_app", "worker", "--loglevel=info", "--queues=default"]
          env:
            # 루트 파일시스템이 읽기 전용이라 DSPy 캐시를 쓰기 가능한 /tmp에 둔다
            - name: DSPY_CACHEDIR
              value: /tmp/dspy_cache
          envFrom:
            - secretRef:
                name: app-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["celery", "-A", "app.core.celery.celery_app", "inspect", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["celery", "-A", "app.core.celery.celery_app", "inspect", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
